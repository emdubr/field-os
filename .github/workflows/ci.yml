name: FIELD OS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Bootstrap committed dependency lock
        if: github.ref == 'refs/heads/main'
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock FIELD OS test dependencies"
            git push origin HEAD:main
          fi
      - name: Syntax check browser scripts
        run: |
          node --check app.js
          node --check workstation.js
          node --check map-engine.js
          node --check route-state.js
          node --check route-planner.js
          node --check field-intel.js
          node --check field-ops.js
          node --check field-tools.js
      - run: npm test
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run desktop UI suite
        run: |
          mkdir -p test-artifacts
          FIELD_SCREENSHOT=test-artifacts/desktop-failure.png npm run test:desktop
      - name: Upload desktop failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-failure
          path: test-artifacts/
          if-no-files-found: ignore

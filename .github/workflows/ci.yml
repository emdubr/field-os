name: FIELD OS CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Syntax check browser scripts
        run: |
          node --check app.js
          node --check track-store.js
          node --check geo-hub.js
          node --check canvas-utils.js
          node --check safety-sync.js
          node --check workstation.js
          node --check map-engine.js
          node --check route-state.js
          node --check runtime.js
          node --check route-planner.js
          node --check field-intel.js
          node --check field-ops.js
          node --check field-tools.js
          node --check offline-check.js
          node --check scripts/vendor-offline.cjs
      - run: npm test
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Run desktop UI suite
        run: |
          mkdir -p test-artifacts
          FIELD_SCREENSHOT=test-artifacts/desktop-failure.png npm run test:desktop
          npm run test:storage
          npm run test:airplane
      - name: Upload desktop failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-failure
          path: test-artifacts/
          if-no-files-found: ignore

  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Safari-engine startup at phone and tablet sizes
        run: npm run test:webkit
